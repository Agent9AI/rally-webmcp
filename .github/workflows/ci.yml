name: Deterministic checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-and-webmcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Rally's email-parser contract is pinned to the Python 3.9 runtime
          # used by the licensed execution host. Newer stdlib versions classify
          # one malformed multipart fixture differently.
          python-version: "3.9"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Run deterministic product and WebMCP checks
        run: make test
      - name: Validate browser JavaScript syntax
        run: |
          node --check site/app.js
          if [ -f site/webmcp/app.js ]; then node --check site/webmcp/app.js; fi
